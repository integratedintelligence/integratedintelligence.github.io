<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B6E8F"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C170"/>
      <stop offset="100%" stop-color="#D4A84B"/>
    </linearGradient>
  </defs>

  <!-- Outer circle — dark steel blue -->
  <circle cx="200" cy="200" r="190" fill="url(#badgeGrad)"/>

  <!-- Inner ring — thin gold accent -->
  <circle cx="200" cy="200" r="168" fill="none" stroke="url(#accentGrad)" stroke-width="2.5"/>

  <!-- Inner field -->
  <circle cx="200" cy="200" r="162" fill="url(#badgeGrad)"/>

  <!-- Three i's as stylised pillars -->
  <!-- Left i -->
  <rect x="112" y="170" width="28" height="90" rx="4" fill="#FFFFFF"/>
  <circle cx="126" cy="148" r="16" fill="#FFFFFF"/>

  <!-- Centre i — taller, gold accent -->
  <rect x="186" y="155" width="28" height="105" rx="4" fill="url(#accentGrad)"/>
  <circle cx="200" cy="133" r="16" fill="url(#accentGrad)"/>

  <!-- Right i -->
  <rect x="260" y="170" width="28" height="90" rx="4" fill="#FFFFFF"/>
  <circle cx="274" cy="148" r="16" fill="#FFFFFF"/>

  <!-- Connecting baseline bar -->
  <rect x="112" y="272" width="176" height="6" rx="3" fill="url(#accentGrad)" opacity="0.85"/>

  <!-- Institute name arc — upper -->
  <path id="upperArc" d="M 62,200 A 138,138 0 0,1 338,200" fill="none"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#FFFFFF" letter-spacing="5" font-variant="small-caps" opacity="0.92">
    <textPath href="#upperArc" startOffset="50%" text-anchor="middle">Integrated Intelligence</textPath>
  </text>

  <!-- Institute name arc — lower -->
  <path id="lowerArc" d="M 80,225 A 128,128 0 0,0 320,225" fill="none"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#FFFFFF" letter-spacing="6.5" font-variant="small-caps" opacity="0.92">
    <textPath href="#lowerArc" startOffset="50%" text-anchor="middle">Institute</textPath>
  </text>
</svg>
